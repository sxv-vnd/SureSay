<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SureSay:Revision with confidence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="logo" href="#">Sure<span>Say</span></a>
      <nav class="steps" aria-label="Revision stages">
        <div class="step active" data-step="start"><span class="step-num">1</span> Start</div>
        <div class="step-line"></div>
        <div class="step" data-step="review"><span class="step-num">2</span> Review</div>
        <div class="step-line"></div>
        <div class="step" data-step="results"><span class="step-num">3</span> Results</div>
      </nav>
    </div>
  </header>

  <main class="stage"></main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <div class="logo logo--sm">Sure<span>Say</span></div>
      <p class="hint">
        An evaluation tool for AI responses. Just a demonstration; no real AI is utilized.
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
